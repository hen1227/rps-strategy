name: CLA

# Everyone who writes a commit in a pull request signs CLA.md once, by posting
# one sentence on the pull request. This check fails until they all have. It is
# meant to be a required check on main, so an unsigned contribution can't be
# merged by accident. CONTRIBUTING.md says why the project needs a CLA at all.
#
# Signatures are kept in signatures.json on the `cla-signatures` branch, so the
# record lives in this repository rather than in somebody else's database. The
# first signature creates that branch, with no history of its own.
#
# pull_request_target rather than pull_request, so the copy of this workflow
# that runs is always main's. A pull request that edited this file to pass would
# otherwise be judged by its own edit. That is safe only because nothing here
# checks out or runs the pull request's code: the script reads the pull request
# through the API and nothing else. Keep it that way. The logic is in
# .github/cla/cla.cjs, with its tests beside it.

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

permissions:
  actions: write # re-run the pull request's check once a signature arrives
  contents: write # commit signatures to the cla-signatures branch
  issues: write # the check's comment (a pull request's comments are issue comments)
  pull-requests: read

concurrency:
  # One run per pull request at a time, so a signature and the run it re-runs
  # can't overlap.
  group: cla-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  cla:
    name: CLA
    # A comment is only worth a runner if it's on a pull request and could be a
    # signature. A test holds this phrase to the sentence in cla.cjs.
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request && contains(github.event.comment.body, 'RPS Strategy CLA'))
    runs-on: ubuntu-latest
    steps:
      # main's copy of the script, never the pull request's.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/cla
          persist-credentials: false
      - uses: actions/github-script@v9
        with:
          script: |
            const { run } = require('./.github/cla/cla.cjs');
            await run({ github, context, core });
