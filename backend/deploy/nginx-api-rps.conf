upstream rps_strategy_backend {
    server unix:/var/www/production/henhen1227/rps-henhen1227-backend.sock;
}

server {
    listen 80;
    listen [::]:80;
    server_name api-rps.henhen1227.com;

    # An opening-book import is one PUT of the whole engine scan -- a few
    # megabytes of JSON -- the graph carries every position the book knows.
    # nginx's default body limit is 1m, so without this the
    # proxy answers 413 before the request reaches the handler, which allows
    # 64 MiB (`openingBookRequestLimit`). Everything else the API accepts is
    # small, so this is the only route that needs it, but the limit is a server
    # directive and costs nothing at this size.
    client_max_body_size 32m;

    location / {
        proxy_pass http://rps_strategy_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
    }
}
