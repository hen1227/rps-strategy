# The two files that let a phone open rps.henhen1227.com links in the app.
#
# Paste these into the server block for rps.henhen1227.com, in
# /etc/nginx/sites-available/production/rps.henhen1227.com on the server. That
# file is not in this repository; the API's is (backend/deploy/nginx-api-rps.conf).
# The files themselves come from frontend/public/.well-known and ship with the
# website (`npm run deploy`, which needs --dotfiles to carry them).
#
# Exact-match locations, so they win over a `location ~ /\.` that denies
# dotfiles, and over any try_files that falls back to index.html: Apple and
# Google both reject a redirect or an HTML page, and say nothing about why.

# No extension, so nginx would call it application/octet-stream.
location = /.well-known/apple-app-site-association {
    default_type application/json;
    try_files $uri =404;
}

location = /.well-known/assetlinks.json {
    default_type application/json;
    try_files $uri =404;
}
